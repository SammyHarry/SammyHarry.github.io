<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FiftyPlates Support</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #5f6b7a;
        --line: #d9dee7;
        --bg: #f7f9fc;
        --panel: #ffffff;
        --accent: #0c58a6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.55;
        color: var(--ink);
        background: var(--bg);
      }

      main {
        width: min(760px, calc(100% - 32px));
        margin: 48px auto;
        padding: 32px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
        line-height: 1.15;
      }

      p {
        margin: 0 0 16px;
      }

      ul {
        padding-left: 22px;
      }

      a {
        color: var(--accent);
      }

      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>FiftyPlates</h1>
      <p class="muted">Support and privacy information for the FiftyPlates iOS app.</p>
      <ul>
        <li><a href="./privacy.html">Privacy Policy</a></li>
        <li><a href="./support.html">Support</a></li>
      </ul>
    </main>
  </body>
</html>
